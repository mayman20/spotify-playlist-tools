name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s backend -p 'test_*.py' -v
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website/spotify-script-hub-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/spotify-script-hub-main/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
